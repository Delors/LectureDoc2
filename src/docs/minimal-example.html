<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="../ld.js" type="module"></script>
        <link rel="stylesheet" href="../ld.css">
    </head>

    <body>
        <template>
            <ld-topic>
                <h1>Title of your presentation.</h1>
            </ld-topic>
            <ld-topic>
                <h2>A Slide!</h2>
                <p>
                    Lorem ipsum dolor sit amet consectetur adipisicing elit.
                    Esse asperiores eos facilis quod, veritatis blanditiis aut
                    delectus doloremque minima voluptate id ipsa sapiente.
                </p>
            </ld-topic>
            <ld-topic class="transition-move-to-top">
                <h2>The following list is shown incrementally.</h2>
                <ul class="incremental-list">
                    <li>This</li>
                    <li>is it</li>
                    <li>- just a Test<span class="incremental">!</span></li>
                </ul>
            </ld-topic>
            <ld-topic>
                <div
                    style="
                        height: 100%;
                        width: 100%;
                        background-color: black;
                        color: white;
                    ">
                    Final page.
                </div>
            </ld-topic>
        </template>
    </body>
</html>
